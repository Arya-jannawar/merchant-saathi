<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 200" width="900" height="200" role="img" aria-label="Thank you Paytm - Team FinnovateX">
  <defs>
    <linearGradient id="tbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071a35"/><stop offset="1" stop-color="#0d2f63"/>
      <animate attributeName="x1" values="0;1;0" dur="9s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="tshine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7dd3fc"/><stop offset="0.5" stop-color="#ffffff"/><stop offset="1" stop-color="#00b9f1"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="-1 0; 1 0; -1 0" dur="4s" repeatCount="indefinite"/>
    </linearGradient>
  </defs>
  <rect width="900" height="200" rx="20" fill="url(#tbg)"/>

  <!-- soft falling gratitude particles -->
  <g fill="#7dd3fc" font-size="16">
    <text x="80" y="30" opacity="0.5">&#10022;<animateTransform attributeName="transform" type="translate" values="0 0; 0 150; 0 0" dur="7s" repeatCount="indefinite"/></text>
    <text x="830" y="24" fill="#ffd76e" opacity="0.5">&#10022;<animateTransform attributeName="transform" type="translate" values="0 0; 0 160; 0 0" dur="8.5s" begin="1.4s" repeatCount="indefinite"/></text>
    <text x="460" y="18" opacity="0.35">&#10022;<animateTransform attributeName="transform" type="translate" values="0 0; 0 170; 0 0" dur="10s" begin="3s" repeatCount="indefinite"/></text>
  </g>

  <text x="450" y="62" text-anchor="middle" font-family="Segoe UI, Arial" font-size="15" font-weight="800" letter-spacing="5" fill="#7dd3fc">
    OUR HEARTFELT THANKS TO
    <animate attributeName="opacity" values="0;1" dur="1.2s" fill="freeze"/>
  </text>
  <text x="450" y="118" text-anchor="middle" font-family="Segoe UI, Arial" font-size="52" font-weight="800" fill="url(#tshine)">
    Paytm &#128591;
    <animate attributeName="opacity" values="0;1" dur="1.6s" fill="freeze"/>
  </text>
  <text x="450" y="150" text-anchor="middle" font-family="Segoe UI, Arial" font-size="14" fill="#c9dcef">
    for shortlisting our presentation and giving Team FinnovateX the stage to build, break and ship
    <animate attributeName="opacity" values="0;1" dur="2.2s" fill="freeze"/>
  </text>
  <text x="450" y="182" text-anchor="middle" font-family="Segoe UI, Arial" font-size="13" font-weight="800" fill="#ffd76e">
    Team FinnovateX &#10022; Arya &#183; Siddhant &#183; Avani
    <animate attributeName="opacity" values="0.5;1;0.5" dur="2.6s" repeatCount="indefinite"/>
  </text>
</svg>
