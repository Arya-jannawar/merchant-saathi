<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 220" width="900" height="220" role="img" aria-label="Guardrail: unsafe Rs 50 rejected, safe Rs 54 suggested in one click">
  <defs>
    <linearGradient id="gcard" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#12335f"/><stop offset="1" stop-color="#0d2547"/>
    </linearGradient>
    <linearGradient id="redg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e63946"/><stop offset="1" stop-color="#9d1c2e"/>
    </linearGradient>
    <linearGradient id="grng" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#15803d"/><stop offset="1" stop-color="#0d5c2a"/>
    </linearGradient>
  </defs>
  <rect width="900" height="220" rx="18" fill="#071a35"/>
  <text x="450" y="32" text-anchor="middle" font-family="Segoe UI, Arial" font-size="16" font-weight="800" fill="#ffffff">The guardrail: code owns pricing, code says no</text>

  <!-- left: unsafe attempt looping -->
  <g>
    <rect x="40" y="52" width="380" height="140" rx="14" fill="url(#gcard)"/>
    <text x="230" y="82" text-anchor="middle" font-family="Segoe UI, Arial" font-size="14" fill="#c9dcef">merchant types price = &#8377;50</text>
    <text x="230" y="128" text-anchor="middle" font-family="Segoe UI, Arial" font-size="30" font-weight="800" fill="url(#redg)">
      &#8377;50 &#10007;
      <animate attributeName="opacity" values="1;1;0.25;1" keyTimes="0;0.55;0.7;1" dur="2.6s" repeatCount="indefinite"/>
    </text>
    <text x="230" y="158" text-anchor="middle" font-family="Segoe UI, Arial" font-size="12.5" fill="#f2a7ad">margin 12.5% &#8212; below the 25% floor &#183; Approve disabled</text>
    <rect x="150" y="96" width="160" height="8" rx="4" fill="#243b6b"/>
    <rect x="150" y="96" width="52" height="8" rx="4" fill="url(#redg)">
      <animate attributeName="width" values="0;52;52" keyTimes="0;0.4;1" dur="2.6s" repeatCount="indefinite"/>
    </rect>
    <g opacity="0">
      <rect x="176" y="106" width="108" height="24" rx="12" fill="#9d1c2e"/>
      <text x="230" y="123" text-anchor="middle" font-family="Segoe UI, Arial" font-size="12" font-weight="800" fill="#ffffff">REJECTED</text>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.8;1" dur="2.6s" repeatCount="indefinite"/>
    </g>
  </g>

  <!-- center flash arrows -->
  <g stroke="#ffd76e" stroke-width="2.5" fill="none" marker-end="none" opacity="0.9">
    <path d="M 434 110 L 466 110">
      <animate attributeName="stroke-dasharray" values="0 40; 40 0" dur="1.2s" repeatCount="indefinite"/>
    </path>
  </g>
  <circle cx="450" cy="110" r="5" fill="#ffd76e">
    <animate attributeName="opacity" values="1;0.3;1" dur="1.2s" repeatCount="indefinite"/>
  </circle>

  <!-- right: safe suggestion -->
  <g>
    <rect x="480" y="52" width="380" height="140" rx="14" fill="url(#gcard)" stroke="#4ade80" stroke-width="1.2"/>
    <text x="670" y="82" text-anchor="middle" font-family="Segoe UI, Arial" font-size="14" fill="#c9dcef">the plan answers back: set it to &#8377;54</text>
    <text x="670" y="128" text-anchor="middle" font-family="Segoe UI, Arial" font-size="30" font-weight="800" fill="url(#grng)">
      &#8377;54 &#10003;
      <animate attributeName="opacity" values="0.25;1;1;0.25" keyTimes="0;0.2;0.75;1" dur="2.6s" repeatCount="indefinite"/>
    </text>
    <text x="670" y="158" text-anchor="middle" font-family="Segoe UI, Arial" font-size="12.5" fill="#a7f3c4">42.9% margin at &#8377;70 &#183; one click applies the safe price</text>
    <rect x="590" y="96" width="160" height="8" rx="4" fill="#243b6b"/>
    <rect x="590" y="96" width="128" height="8" rx="4" fill="url(#grng)">
      <animate attributeName="width" values="0;128;128" keyTimes="0;0.55;1" dur="2.6s" repeatCount="indefinite"/>
    </rect>
    <g opacity="0">
      <rect x="606" y="106" width="128" height="24" rx="12" fill="#0d5c2a"/>
      <text x="670" y="123" text-anchor="middle" font-family="Segoe UI, Arial" font-size="12" font-weight="800" fill="#ffffff">PASSES FLOOR</text>
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.3;0.45;0.9;1" dur="2.6s" repeatCount="indefinite"/>
    </g>
  </g>

  <text x="450" y="212" text-anchor="middle" font-family="Segoe UI, Arial" font-size="12.5" fill="#8fb3d9">AI may draft the words &#8212; it can never set the price</text>
</svg>
