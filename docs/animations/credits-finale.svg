<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" width="900" height="300" role="img" aria-label="Team FinovateX: Avani Jannawar, Siddhant Pardeshi, Arya Jannawar">
  <defs>
    <radialGradient id="eyeGloss" cx="0.35" cy="0.3" r="0.9">
      <stop offset="0" stop-color="#2b3a55"/>
      <stop offset="0.55" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#050b16"/>
    </radialGradient>
    <radialGradient id="cheekGloss" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fda4af" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#fda4af" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vignette" cx="0.5" cy="0.42" r="0.75">
      <stop offset="0" stop-color="#123d7c"/>
      <stop offset="1" stop-color="#050f22"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fbbf24"/>
      <stop offset="0.5" stop-color="#fef3c7"/>
      <stop offset="1" stop-color="#fbbf24"/>
    </linearGradient>
    <linearGradient id="sweepG" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="900" height="300" rx="18" fill="url(#vignette)"/>

  <!-- starfield -->
  <g fill="#cfe9ff">
    <circle class="s1" cx="70" cy="50" r="1.8"/><circle class="s2" cx="150" cy="90" r="1.4"/><circle class="s3" cx="230" cy="40" r="1.9"/>
    <circle class="s4" cx="330" cy="70" r="1.3"/><circle class="s1" cx="420" cy="35" r="1.7"/><circle class="s2" cx="510" cy="80" r="1.5"/>
    <circle class="s3" cx="600" cy="45" r="1.8"/><circle class="s4" cx="690" cy="85" r="1.4"/><circle class="s1" cx="780" cy="50" r="1.9"/>
    <circle class="s2" cx="850" cy="95" r="1.5"/><circle class="s3" cx="100" cy="150" r="1.5"/><circle class="s4" cx="820" cy="170" r="1.6"/>
    <circle class="s1" cx="180" cy="200" r="1.4"/><circle class="s2" cx="720" cy="210" r="1.5"/><circle class="s3" cx="450" cy="215" r="1.3"/>
    <circle class="s4" cx="60" cy="245" r="1.6"/><circle class="s1" cx="845" cy="250" r="1.5"/>
  </g>

  <!-- hero mascot waving -->
  <g class="hero">
    <path d="M62 60 q8-16 2-22" stroke="#166534" stroke-width="3" fill="none" stroke-linecap="round"/>
    <circle cx="60" cy="68" r="9" fill="#ef4444"/>
    <circle cx="57" cy="65" r="2.6" fill="#fecaca"/>
    <path d="M36 92 Q32 72 55 70 Q59 56 74 60 Q90 55 96 72 Q106 80 101 94 Q96 102 68 102 Q42 102 36 92 Z" fill="#fff1e6"/>
    <path d="M39 104 L44 134 Q66 142 88 134 L93 104 Z" fill="#00b9f1"/>
    <path d="M54 106 L58 138" stroke="#0393c7" stroke-width="3" stroke-linecap="round"/>
    <path d="M78 106 L74 138" stroke="#0393c7" stroke-width="3" stroke-linecap="round"/>
    <circle cx="52" cy="84" r="4.6" fill="url(#eyeGloss)"/><circle class="shine" cx="50.44" cy="82.25" r="1.93" fill="#fff"/><circle cx="80" cy="84" r="4.6" fill="url(#eyeGloss)"/><circle class="shine" cx="78.44" cy="82.25" r="1.93" fill="#fff"/>
    <circle cx="50.4" cy="82" r="1.5" fill="#fff"/><circle cx="78.4" cy="82" r="1.5" fill="#fff"/>
    <ellipse cx="42" cy="92" rx="5" ry="3" fill="url(#cheekGloss)"/><ellipse cx="90" cy="92" rx="5" ry="3" fill="url(#cheekGloss)"/>
    <path d="M58 92 Q66 102 74 92" stroke="#7c2d12" stroke-width="2.8" fill="none" stroke-linecap="round"/>
    <g class="arm">
      <ellipse cx="112" cy="96" rx="10" ry="5.5" fill="url(#cheekGloss)"/>
    </g>
    <path class="spk" d="M120 66 l2.4 5.4 5.4 2.4 -5.4 2.4 -2.4 5.4 -2.4 -5.4 -5.4 -2.4 5.4 -2.4 Z" fill="#fbbf24"/>
    <path class="spk2" d="M18 118 l1.8 4 4 1.8 -4 1.8 -1.8 4 -1.8 -4 -4 -1.8 4 -1.8 Z" fill="#f472b6"/>
  </g>

  <text x="470" y="66" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="6" fill="#8fd8ff" class="fade1" xml:space="preserve">M E E T&#160;&#160;T H E&#160;&#160;T E A M</text>
  <text x="470" y="108" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="30" font-weight="800" fill="#ffffff" class="fade2">TEAM FINOVATEX</text>
  <rect x="330" y="120" width="280" height="3" rx="1.5" fill="url(#gold)"/>

  <g class="name nA"><text x="300" y="162" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="800" fill="url(#gold)">&#9733; Avani Jannawar</text></g>
  <g class="name nB"><text x="600" y="162" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="800" fill="url(#gold)">&#9733; Siddhant Pardeshi</text></g>
  <g class="name nC"><text x="450" y="196" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="800" fill="url(#gold)">&#9733; Arya Jannawar</text></g>

  <text x="450" y="238" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="800" fill="#00b9f1" class="pulseBig">Proof, not a black box.</text>
  <text x="450" y="262" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" fill="#bcd6ee">Built for the Paytm AI Hackathon · Pune · Track 1 - Merchant Growth AI · synthetic demo data, simulated campaigns, zero fluff</text>
  <rect x="150" y="276" width="600" height="2.5" rx="1" fill="#1d4e86"/>
  <rect class="sweepline" x="150" y="276" width="120" height="2.5" fill="url(#sweepG)"/>

  <style>
    .fade1 { animation: appear 9s ease infinite; }
    .fade2 { animation: appear2 9s ease infinite; }
    @keyframes appear { 0% { opacity: 0; } 10%, 90% { opacity: 0.95; } 100% { opacity: 0; } }
    @keyframes appear2 { 0% { opacity: 0; transform: translateY(8px); } 14%, 92% { opacity: 1; transform: translateY(0); } 100% { opacity: 0; } }
    .name { transform-box: fill-box; transform-origin: center; animation: riseName 9s ease infinite; }
    .nA { animation-delay: 0.8s; }
    .nB { animation-delay: 1.5s; }
    .nC { animation-delay: 2.2s; }
    @keyframes riseName { 0%, 6% { opacity: 0; transform: translateY(10px) scale(0.9); } 18%, 92% { opacity: 1; transform: translateY(0) scale(1); } 100% { opacity: 0; } }
    .hero { transform-box: fill-box; transform-origin: center bottom; animation: bob 2.6s ease-in-out infinite; }
    @keyframes bob { 0%, 100% { transform: translateY(0) rotate(0); } 50% { transform: translateY(-8px) rotate(-2deg); } }
    .arm { transform-box: fill-box; transform-origin: 8% 60%; animation: wave 1.4s ease-in-out infinite; }
    @keyframes wave { 0%, 100% { transform: rotate(-12deg); } 50% { transform: rotate(18deg); } }
    .spk { transform-box: fill-box; transform-origin: center; animation: twinkleS 2s ease-in-out infinite; }
    .spk2 { transform-box: fill-box; transform-origin: center; animation: twinkleS 2s 1s ease-in-out infinite; }
    @keyframes twinkleS { 0%, 100% { opacity: 0.2; transform: scale(0.7); } 50% { opacity: 1; transform: scale(1.15); } }
    .s1, .s2, .s3, .s4 { animation: star 2.8s ease-in-out infinite; }
    .s2 { animation-delay: 0.7s; } .s3 { animation-delay: 1.4s; } .s4 { animation-delay: 2.1s; }
    @keyframes star { 0%, 100% { opacity: 0.2; } 50% { opacity: 1; } }
    .pulseBig { animation: big 2.4s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    @keyframes big { 0%, 100% { opacity: 0.82; transform: scale(1); } 50% { opacity: 1; transform: scale(1.05); } }
    .sweepline { animation: lineSweep 3.4s ease-in-out infinite; }
    @keyframes lineSweep { 0% { transform: translateX(-140px); opacity: 0; } 25% { opacity: 1; } 75% { transform: translateX(620px); opacity: 0; } 100% { transform: translateX(620px); opacity: 0; } }
      .shine { animation: sparkle 3.4s ease-in-out infinite; }
    @keyframes sparkle { 0%, 100% { opacity: 0.7; } 50% { opacity: 1; } }
  </style>
</svg>
