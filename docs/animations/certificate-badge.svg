<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" width="320" height="320" role="img" aria-label="Certified participant rosette">
  <defs>
    <linearGradient id="roseg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffd76e"/><stop offset="1" stop-color="#b8860b"/>
    </linearGradient>
    <linearGradient id="ribbong" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#00b9f1"/><stop offset="1" stop-color="#005f8f"/>
    </linearGradient>
  </defs>

  <!-- ribbons -->
  <path d="M 120 210 L 92 300 L 130 282 L 152 312 L 176 224 Z" fill="url(#ribbong)"/>
  <path d="M 200 210 L 228 300 L 190 282 L 168 312 L 144 224 Z" fill="url(#ribbong)" opacity="0.85"/>

  <!-- rotating dashed halo -->
  <circle cx="160" cy="130" r="96" fill="none" stroke="#00b9f1" stroke-width="2" stroke-dasharray="10 12">
    <animateTransform attributeName="transform" type="rotate" values="0 160 130; 360 160 130" dur="24s" repeatCount="indefinite"/>
  </circle>
  <circle cx="160" cy="130" r="84" fill="none" stroke="#ffd76e" stroke-width="1.6" stroke-dasharray="4 9">
    <animateTransform attributeName="transform" type="rotate" values="360 160 130; 0 160 130" dur="18s" repeatCount="indefinite"/>
  </circle>

  <!-- rosette scallops (breathing) -->
  <g fill="url(#roseg)">
    <animateTransform attributeName="transform" type="scale" values="1;1.035;1" dur="3s" repeatCount="indefinite" additive="sum"/>
    <g transform="translate(160 130)">
      <circle r="70"/>
      <g>
        <animateTransform attributeName="transform" type="rotate" values="0;15;0" dur="9s" repeatCount="indefinite"/>
        <circle cx="0" cy="-70" r="14"/><circle cx="35" cy="-60.6" r="14"/><circle cx="60.6" cy="-35" r="14"/><circle cx="70" cy="0" r="14"/>
        <circle cx="60.6" cy="35" r="14"/><circle cx="35" cy="60.6" r="14"/><circle cx="0" cy="70" r="14"/><circle cx="-35" cy="60.6" r="14"/>
        <circle cx="-60.6" cy="35" r="14"/><circle cx="-70" cy="0" r="14"/><circle cx="-60.6" cy="-35" r="14"/><circle cx="-35" cy="-60.6" r="14"/>
      </g>
    </g>
  </g>
  <circle cx="160" cy="130" r="56" fill="#0b2447"/>

  <!-- seal text -->
  <text x="160" y="108" text-anchor="middle" font-family="Segoe UI, Arial" font-size="13" font-weight="800" letter-spacing="2.5" fill="#ffd76e">CERTIFIED</text>
  <text x="160" y="130" text-anchor="middle" font-family="Segoe UI, Arial" font-size="12.5" font-weight="700" fill="#ffffff">PARTICIPANT</text>
  <text x="160" y="152" text-anchor="middle" font-family="Segoe UI, Arial" font-size="10.5" fill="#7dd3fc">Paytm AI Hackathon</text>
  <!-- little star pulse -->
  <text x="160" y="172" text-anchor="middle" font-size="14" fill="#ffd76e">&#10022;
    <animate attributeName="opacity" values="0.4;1;0.4" dur="2s" repeatCount="indefinite"/>
  </text>
</svg>
