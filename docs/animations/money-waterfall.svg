<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 240" width="900" height="240" role="img" aria-label="Money waterfall: Rs 700 sales minus Rs 400 costs equals Rs 300 contribution">
  <defs>
    <linearGradient id="salesg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#00b9f1"/><stop offset="1" stop-color="#005f8f"/>
    </linearGradient>
    <linearGradient id="costg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e63946"/><stop offset="1" stop-color="#9d1c2e"/>
    </linearGradient>
    <linearGradient id="conng" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4ade80"/><stop offset="1" stop-color="#15803d"/>
    </linearGradient>
  </defs>
  <rect width="900" height="240" rx="18" fill="#071a35"/>
  <text x="450" y="30" text-anchor="middle" font-family="Segoe UI, Arial" font-size="16" font-weight="800" fill="#ffffff">Where the money went &#8212; measured to the rupee</text>
  <line x1="80" y1="190" x2="820" y2="190" stroke="#243b6b" stroke-width="2"/>

  <!-- sales bar: fills to Rs 700 height -->
  <rect x="150" y="60" width="150" height="130" rx="8" fill="url(#salesg)">
    <animate attributeName="height" values="0;130;130" keyTimes="0;0.45;1" dur="2.8s" repeatCount="indefinite"/>
    <animate attributeName="y" values="190;60;60" keyTimes="0;0.45;1" dur="2.8s" repeatCount="indefinite"/>
  </rect>
  <text x="225" y="50" text-anchor="middle" font-family="Segoe UI, Arial" font-size="19" font-weight="800" fill="#7dd3fc">
    &#8377;700
    <animate attributeName="opacity" values="0;1;1" keyTimes="0;0.45;1" dur="2.8s" repeatCount="indefinite"/>
  </text>
  <text x="225" y="212" text-anchor="middle" font-family="Segoe UI, Arial" font-size="12.5" fill="#c9dcef">bundle sales (10 redemptions)</text>

  <!-- cost bar: drops from the sales top -->
  <rect x="390" y="128" width="150" height="62" rx="8" fill="url(#costg)">
    <animate attributeName="height" values="0;0;62;62" keyTimes="0;0.42;0.7;1" dur="2.8s" repeatCount="indefinite"/>
    <animate attributeName="y" values="128;128;128;128" keyTimes="0;0.42;0.7;1" dur="2.8s" repeatCount="indefinite"/>
  </rect>
  <text x="465" y="118" text-anchor="middle" font-family="Segoe UI, Arial" font-size="19" font-weight="800" fill="#f2a7ad">
    &#8722;&#8377;400
    <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.42;0.7;1" dur="2.8s" repeatCount="indefinite"/>
  </text>
  <text x="465" y="212" text-anchor="middle" font-family="Segoe UI, Arial" font-size="12.5" fill="#c9dcef">ingredients + packaging</text>

  <!-- connector dashes -->
  <g stroke="#3f6ea6" stroke-width="1.6" stroke-dasharray="5 6" opacity="0.85">
    <line x1="305" y1="60" x2="385" y2="60"/>
    <line x1="305" y1="128" x2="385" y2="128">
      <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.42;0.7;1" dur="2.8s" repeatCount="indefinite"/>
    </line>
    <line x1="545" y1="128" x2="625" y2="128"/>
  </g>

  <!-- contribution bar -->
  <rect x="630" y="128" width="150" height="62" rx="8" fill="url(#conng)">
    <animate attributeName="height" values="0;0;62;62" keyTimes="0;0.65;0.9;1" dur="2.8s" repeatCount="indefinite"/>
  </rect>
  <text x="705" y="118" text-anchor="middle" font-family="Segoe UI, Arial" font-size="22" font-weight="800" fill="#4ade80">
    = &#8377;300
    <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.65;0.9;1" dur="2.8s" repeatCount="indefinite"/>
  </text>
  <text x="705" y="212" text-anchor="middle" font-family="Segoe UI, Arial" font-size="12.5" fill="#c9dcef">toward fixed costs</text>

  <!-- golden pulse on final bar -->
  <rect x="630" y="128" width="150" height="62" rx="8" fill="none" stroke="#ffd76e" stroke-width="2">
    <animate attributeName="opacity" values="0;0;1;0.2;1;0" keyTimes="0;0.85;0.9;0.95;0.98;1" dur="2.8s" repeatCount="indefinite"/>
  </rect>

  <text x="450" y="232" text-anchor="middle" font-family="Segoe UI, Arial" font-size="12.5" fill="#8fb3d9">honest caveat printed on screen: contribution &#8800; proven incremental profit</text>
</svg>
