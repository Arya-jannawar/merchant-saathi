<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 220" width="900" height="220" role="img" aria-label="Forecast: ridge line draws itself with an honest error band, MAE shown">
  <defs>
    <linearGradient id="band" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00b9f1" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#00b9f1" stop-opacity="0.30"/>
    </linearGradient>
  </defs>
  <rect width="900" height="220" rx="18" fill="#071a35"/>
  <text x="450" y="30" text-anchor="middle" font-family="Segoe UI, Arial" font-size="16" font-weight="800" fill="#ffffff">Tomorrow's expected sales &#8212; with the error bar kept visible</text>

  <!-- axes -->
  <line x1="90" y1="170" x2="700" y2="170" stroke="#243b6b" stroke-width="2"/>
  <line x1="90" y1="60" x2="90" y2="170" stroke="#243b6b" stroke-width="2"/>

  <!-- history dots -->
  <g fill="#7dd3fc" opacity="0.85">
    <circle cx="120" cy="128" r="3.5"/><circle cx="160" cy="112" r="3.5"/><circle cx="200" cy="132" r="3.5"/>
    <circle cx="240" cy="104" r="3.5"/><circle cx="280" cy="120" r="3.5"/><circle cx="320" cy="96" r="3.5"/>
    <circle cx="360" cy="112" r="3.5"/><circle cx="400" cy="88" r="3.5"/><circle cx="440" cy="104" r="3.5"/>
    <circle cx="480" cy="80" r="3.5"/><circle cx="520" cy="96" r="3.5"/><circle cx="560" cy="72" r="3.5"/>
  </g>

  <!-- error band -->
  <path d="M 560 60 L 660 42 L 700 34 L 700 82 L 660 74 L 560 84 Z" fill="url(#band)">
    <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.55;0.85;1" dur="3s" repeatCount="indefinite"/>
  </path>

  <!-- trend line draws itself -->
  <path d="M 110 126 C 250 112, 430 88, 560 72" stroke="#00b9f1" stroke-width="3" fill="none" stroke-linecap="round">
    <animate attributeName="stroke-dasharray" values="0 500; 500 0" dur="1.6s" repeatCount="indefinite"/>
  </path>
  <path d="M 560 72 C 610 60, 650 48, 700 56" stroke="#ffd76e" stroke-width="3" fill="none" stroke-linecap="round" stroke-dasharray="8 7">
    <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.5;0.75;1" dur="3s" repeatCount="indefinite"/>
  </path>

  <!-- tomorrow marker -->
  <g opacity="0">
    <circle cx="700" cy="56" r="7" fill="#ffd76e"/>
    <circle cx="700" cy="56" r="7" fill="none" stroke="#ffd76e">
      <animate attributeName="r" values="7;22" dur="1.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.9;0" dur="1.6s" repeatCount="indefinite"/>
    </circle>
    <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.7;0.85;1" dur="3s" repeatCount="indefinite"/>
  </g>
  <text x="700" y="42" text-anchor="middle" font-family="Segoe UI, Arial" font-size="14" font-weight="800" fill="#ffd76e">
    tomorrow = estimate
    <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.7;0.9;1" dur="3s" repeatCount="indefinite"/>
  </text>

  <!-- MAE badges -->
  <g font-family="Segoe UI, Arial" text-anchor="middle">
    <rect x="722" y="86" width="156" height="34" rx="17" fill="#0e2c55" stroke="#00b9f1" stroke-width="1.2"/>
    <text x="800" y="108" font-size="13" font-weight="700" fill="#7dd3fc">ridge MAE &#8377;227.11</text>
    <rect x="722" y="128" width="156" height="34" rx="17" fill="#0e2c55" stroke="#5b6b7e" stroke-width="1.2"/>
    <text x="800" y="150" font-size="13" font-weight="700" fill="#c9dcef">baseline &#8377;234.71</text>
  </g>
  <text x="390" y="200" text-anchor="middle" font-family="Segoe UI, Arial" font-size="12.5" fill="#8fb3d9">14-day walk-forward backtest picks the model &#183; 42 trading days minimum &#183; never guesses on thin history</text>
</svg>
