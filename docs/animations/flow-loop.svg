<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 240" width="900" height="240" role="img" aria-label="The owner control loop: dashboard to opportunity to offer to approval to campaign to results">
  <defs>
    <linearGradient id="cardg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#12335f"/><stop offset="1" stop-color="#0d2547"/>
    </linearGradient>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#00b9f1"/>
    </marker>
  </defs>
  <rect width="900" height="240" rx="18" fill="#071a35"/>

  <text x="450" y="34" text-anchor="middle" font-family="Segoe UI, Arial" font-size="16" font-weight="800" fill="#ffffff">One honest loop &#8212; the owner never leaves it</text>

  <!-- six stage cards around a ring -->
  <g font-family="Segoe UI, Arial" text-anchor="middle">
    <g>
      <rect x="30" y="70" width="200" height="46" rx="10" fill="url(#cardg)" stroke="#00b9f1" stroke-width="1.2"/>
      <text x="130" y="98" font-size="14.5" font-weight="700" fill="#cfe8fb">1 &#183; Dashboard</text>
    </g>
    <g>
      <rect x="345" y="56" width="210" height="46" rx="10" fill="url(#cardg)" stroke="#00b9f1" stroke-width="1.2"/>
      <text x="450" y="84" font-size="14.5" font-weight="700" fill="#cfe8fb">2 &#183; Opportunity + evidence</text>
    </g>
    <g>
      <rect x="672" y="70" width="200" height="46" rx="10" fill="url(#cardg)" stroke="#00b9f1" stroke-width="1.2"/>
      <text x="772" y="98" font-size="14.5" font-weight="700" fill="#cfe8fb">3 &#183; Offer math</text>
    </g>
    <g>
      <rect x="672" y="160" width="200" height="46" rx="10" fill="url(#cardg)" stroke="#ffd76e" stroke-width="1.2"/>
      <text x="772" y="188" font-size="14.5" font-weight="700" fill="#ffe9ad">4 &#183; Hash-bound approval</text>
    </g>
    <g>
      <rect x="345" y="174" width="210" height="46" rx="10" fill="url(#cardg)" stroke="#00b9f1" stroke-width="1.2"/>
      <text x="450" y="202" font-size="14.5" font-weight="700" fill="#cfe8fb">5 &#183; Simulated campaign</text>
    </g>
    <g>
      <rect x="30" y="160" width="200" height="46" rx="10" fill="url(#cardg)" stroke="#4ade80" stroke-width="1.2"/>
      <text x="130" y="188" font-size="14.5" font-weight="700" fill="#b7f7cd">6 &#183; &#8377;300 results + PDF</text>
    </g>
  </g>

  <!-- arrows -->
  <g stroke="#00b9f1" stroke-width="2" fill="none" marker-end="url(#arr)">
    <line x1="232" y1="92" x2="338" y2="80">
      <animate attributeName="stroke-opacity" values="0.25;1;0.25" dur="3.6s" repeatCount="indefinite"/>
    </line>
    <line x1="557" y1="80" x2="664" y2="92">
      <animate attributeName="stroke-opacity" values="0.25;1;0.25" dur="3.6s" begin="0.6s" repeatCount="indefinite"/>
    </line>
    <line x1="772" y1="118" x2="772" y2="154">
      <animate attributeName="stroke-opacity" values="0.25;1;0.25" dur="3.6s" begin="1.2s" repeatCount="indefinite"/>
    </line>
    <line x1="664" y1="182" x2="562" y2="196">
      <animate attributeName="stroke-opacity" values="0.25;1;0.25" dur="3.6s" begin="1.8s" repeatCount="indefinite"/>
    </line>
    <line x1="343" y1="196" x2="236" y2="182">
      <animate attributeName="stroke-opacity" values="0.25;1;0.25" dur="3.6s" begin="2.4s" repeatCount="indefinite"/>
    </line>
    <line x1="130" y1="158" x2="130" y2="122" stroke-dasharray="4 5" stroke="#8fb3d9" marker-end="url(#arr)">
      <animate attributeName="stroke-opacity" values="0.3;0.9;0.3" dur="3.6s" begin="3s" repeatCount="indefinite"/>
    </line>
  </g>

  <!-- travelling pulse dot along the loop -->
  <circle r="6" fill="#ffd76e">
    <animateMotion dur="3.6s" repeatCount="indefinite" path="M 236 93 L 340 80 L 560 80 L 660 93 L 772 120 L 772 152 L 660 184 L 560 197 L 340 197 L 236 184 L 130 156 L 130 124 Z"/>
    <animate attributeName="opacity" values="1;1;1" dur="3.6s" repeatCount="indefinite"/>
  </circle>
  <circle r="12" fill="none" stroke="#ffd76e" stroke-width="1.5" opacity="0.6">
    <animateMotion dur="3.6s" repeatCount="indefinite" path="M 236 93 L 340 80 L 560 80 L 660 93 L 772 120 L 772 152 L 660 184 L 560 197 L 340 197 L 236 184 L 130 156 L 130 124 Z"/>
    <animate attributeName="r" values="4;14;4" dur="3.6s" repeatCount="indefinite"/>
  </circle>

  <text x="450" y="228" text-anchor="middle" font-family="Segoe UI, Arial" font-size="12.5" fill="#8fb3d9">observe &#8594; price safely &#8594; approve exactly &#8594; simulate &#8594; measure &#8594; repeat</text>
</svg>
