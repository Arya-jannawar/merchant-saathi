<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 250" width="900" height="250" role="img" aria-label="Merchant Saathi - evidence backed AI growth partner for small merchants">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07234a">
        <animate attributeName="stop-color" values="#07234a;#0a2e5c;#07234a" dur="6s" repeatCount="indefinite"/>
      </stop>
      <stop offset="0.55" stop-color="#0a2e5c">
        <animate attributeName="stop-color" values="#0a2e5c;#123d7c;#0a2e5c" dur="6s" repeatCount="indefinite"/>
      </stop>
      <stop offset="1" stop-color="#06203f">
        <animate attributeName="stop-color" values="#06203f;#0a3560;#06203f" dur="6s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="accentline" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00b9f1"/>
      <stop offset="0.5" stop-color="#fbbf24"/>
      <stop offset="1" stop-color="#00b9f1"/>
    </linearGradient>
  </defs>

  <rect width="900" height="250" fill="url(#bg)"/>
  <rect class="sweep" x="-320" y="0" width="300" height="250" fill="url(#shine)" transform="skewX(-18)"/>

  <!-- twinkling stars -->
  <g fill="#8fd8ff">
    <circle cx="60" cy="40" r="2" class="tw tw1"/>
    <circle cx="140" cy="90" r="1.6" class="tw tw2"/>
    <circle cx="840" cy="60" r="2.2" class="tw tw3"/>
    <circle cx="780" cy="30" r="1.5" class="tw tw4"/>
    <circle cx="700" cy="110" r="1.8" class="tw tw2"/>
    <circle cx="870" cy="150" r="1.6" class="tw tw1"/>
    <circle cx="40" cy="180" r="1.7" class="tw tw3"/>
    <circle cx="110" cy="130" r="1.4" class="tw tw4"/>
  </g>

  <text x="450" y="66" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="46" font-weight="800" fill="#ffffff" letter-spacing="2" class="titleGlow">MERCHANT SAATHI</text>
  <rect x="250" y="80" width="400" height="4" rx="2" fill="url(#accentline)">
    <animate attributeName="width" values="0;400;400" dur="2.4s" fill="freeze" calcMode="spline" keyTimes="0;0.7;1" keySplines="0.22 1 0.36 1;0 0 1 1"/>
  </rect>
  <text x="450" y="112" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="700" fill="#00b9f1" class="pulseSoft">Proof, not a black box.</text>
  <text x="450" y="136" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" fill="#bcd6ee">Every number traceable · every unsafe offer visibly rejected · every campaign honestly simulated</text>

  <!-- six mascot buddies, bouncing in a staggered rhythm -->
  <g transform="translate(0 54)">
  <g class="m m1"><!-- Mithu cupcake -->
    <path d="M56 96 q6-14 2-18" stroke="#166534" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <circle cx="55" cy="102" r="7" fill="#ef4444"/>
    <path d="M38 122 Q35 106 52 104 Q55 94 66 97 Q78 93 82 104 Q90 110 86 120 Q82 126 62 126 Q44 126 38 122 Z" fill="#fff1e6"/>
    <path d="M40 128 L44 148 Q60 154 76 148 L80 128 Z" fill="#00b9f1"/>
    <circle cx="52" cy="114" r="3.4" fill="#0f172a"/><circle cx="68" cy="114" r="3.4" fill="#0f172a"/>
    <path d="M55 121 q7 6 14 0" stroke="#7c2d12" stroke-width="2.4" fill="none" stroke-linecap="round" transform="translate(-5 0)"/>
  </g>
  <g class="m m2"><!-- Chotu samosa -->
    <path d="M170 96 Q188 110 194 136 Q196 148 186 152 L154 152 Q144 148 146 136 Q152 110 170 96 Z" fill="#f4a950"/>
    <path d="M170 96 Q176 106 178 118" stroke="#d9822b" stroke-width="4" fill="none" stroke-linecap="round"/>
    <circle cx="163" cy="128" r="3.4" fill="#0f172a"/><circle cx="177" cy="128" r="3.4" fill="#0f172a"/>
    <path d="M164 137 q7 6 14 0" stroke="#7c2d12" stroke-width="2.4" fill="none" stroke-linecap="round" transform="translate(-2 0)"/>
  </g>
  <g class="m m3"><!-- Dhoom chai -->
    <path d="M272 106 L277 148 Q288 153 299 148 L304 106 Z" fill="#fef3c7" opacity="0.55"/>
    <path d="M272 106 L277 148 Q288 153 299 148 L304 106 Z" fill="none" stroke="#e2e8f0" stroke-width="3"/>
    <path d="M275 122 L278.5 144 Q288 148 297.5 144 L301 122 Z" fill="#d9a05b"/>
    <path d="M283 96 q5-9 0-16" stroke="#cbd5e1" stroke-width="3" fill="none" stroke-linecap="round"/>
    <path d="M295 98 q-5-9 0-16" stroke="#cbd5e1" stroke-width="3" fill="none" stroke-linecap="round"/>
    <circle cx="282" cy="130" r="3.2" fill="#0f172a"/><circle cx="294" cy="130" r="3.2" fill="#0f172a"/>
    <path d="M282 137 q7 6 13 0" stroke="#7c2d12" stroke-width="2.2" fill="none" stroke-linecap="round"/>
  </g>
  <g class="m m4"><!-- Shona coin -->
    <circle cx="410" cy="126" r="24" fill="#fbbf24" stroke="#d97706" stroke-width="4"/>
    <circle cx="410" cy="126" r="17" fill="none" stroke="#fde68a" stroke-width="2"/>
    <text x="410" y="133" text-anchor="middle" font-family="Segoe UI, Arial" font-size="16" font-weight="800" fill="#92400e">&#8377;</text>
    <circle cx="403" cy="118" r="3" fill="#0f172a"/><circle cx="417" cy="118" r="3" fill="#0f172a"/>
    <path d="M404 125 q6 5 12 0" stroke="#7c2d12" stroke-width="2.2" fill="none" stroke-linecap="round"/>
  </g>
  <g class="m m5"><!-- Laddu -->
    <circle cx="530" cy="126" r="24" fill="#f59e0b"/>
    <circle cx="522" cy="114" r="4" fill="#fbbf24"/><circle cx="538" cy="116" r="4" fill="#fbbf24"/><circle cx="530" cy="140" r="4" fill="#fbbf24"/><circle cx="516" cy="134" r="3.4" fill="#fbbf24"/><circle cx="545" cy="134" r="3.4" fill="#fbbf24"/>
    <circle cx="524" cy="121" r="3.2" fill="#0f172a"/><circle cx="537" cy="121" r="3.2" fill="#0f172a"/>
    <path d="M524 128 q7 6 13 0" stroke="#7c2d12" stroke-width="2.2" fill="none" stroke-linecap="round"/>
    <path d="M530 96 q10-7 18-3 q-6 8 -18 5" fill="#16a34a"/>
  </g>
  <g class="m m6"><!-- Jalebi -->
    <g fill="none" stroke="#f97316" stroke-width="9" stroke-linecap="round">
      <circle cx="650" cy="126" r="22" stroke-dasharray="96 45" stroke-dashoffset="-14"/>
      <circle cx="650" cy="126" r="11" stroke-dasharray="48 22" stroke-dashoffset="6"/>
    </g>
    <circle cx="644" cy="119" r="3.2" fill="#0f172a"/><circle cx="656" cy="119" r="3.2" fill="#0f172a"/>
    <path d="M644 127 q7 6 13 0" stroke="#7c2d12" stroke-width="2.2" fill="none" stroke-linecap="round"/>
  </g>
  <g class="m m7"><!-- mini Mithu again at the end for rhythm -->
    <circle cx="770" cy="122" r="20" fill="#fff1e6" stroke="#fce1d4" stroke-width="3"/>
    <circle cx="764" cy="118" r="3.2" fill="#0f172a"/><circle cx="776" cy="118" r="3.2" fill="#0f172a"/>
    <path d="M764 126 q7 6 13 0" stroke="#7c2d12" stroke-width="2.2" fill="none" stroke-linecap="round"/>
    <circle cx="770" cy="98" r="6" fill="#ef4444"/>
  </g>
  </g>

  <text x="450" y="220" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" fill="#7ea6cf">One evidence-backed opportunity · margin-safe offers · hash-bound approvals · simulated campaigns</text>
  <text x="450" y="242" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="700" fill="#fbbf24" class="pulseSoft">Paytm AI Hackathon · Pune · Track 1 - Merchant Growth AI</text>

  <style>
    .sweep { animation: sweep 5.5s ease-in-out infinite; }
    @keyframes sweep { 0% { transform: translateX(-340px) skewX(-18deg); opacity: 0; } 15% { opacity: 1; } 55% { transform: translateX(950px) skewX(-18deg); opacity: 0; } 100% { transform: translateX(950px) skewX(-18deg); opacity: 0; } }
    .tw { animation: twinkle 2.6s ease-in-out infinite; transform-origin: center; }
    .tw1 { animation-delay: 0s; } .tw2 { animation-delay: 0.6s; } .tw3 { animation-delay: 1.2s; } .tw4 { animation-delay: 1.8s; }
    @keyframes twinkle { 0%, 100% { opacity: 0.25; } 50% { opacity: 1; } }
    .titleGlow { animation: glow 3.2s ease-in-out infinite; }
    @keyframes glow { 0%, 100% { opacity: 1; } 50% { opacity: 0.86; } }
    .pulseSoft { animation: soft 2.8s ease-in-out infinite; }
    @keyframes soft { 0%, 100% { opacity: 0.75; } 50% { opacity: 1; } }
    .m { transform-box: fill-box; transform-origin: center bottom; }
    .m1 { animation: hop 1.6s cubic-bezier(0.36,0.07,0.19,0.97) infinite; }
    .m2 { animation: hop 1.6s 0.22s cubic-bezier(0.36,0.07,0.19,0.97) infinite; }
    .m3 { animation: hop 1.6s 0.44s cubic-bezier(0.36,0.07,0.19,0.97) infinite; }
    .m4 { animation: hop 1.6s 0.66s cubic-bezier(0.36,0.07,0.19,0.97) infinite; }
    .m5 { animation: hop 1.6s 0.88s cubic-bezier(0.36,0.07,0.19,0.97) infinite; }
    .m6 { animation: hop 1.6s 1.1s cubic-bezier(0.36,0.07,0.19,0.97) infinite; }
    .m7 { animation: hop 1.6s 1.32s cubic-bezier(0.36,0.07,0.19,0.97) infinite; }
    @keyframes hop { 0%, 60%, 100% { transform: translateY(0) scale(1, 1); } 20% { transform: translateY(-14px) scale(0.96, 1.05); } 40% { transform: translateY(0) scale(1.04, 0.94); } 50% { transform: translateY(-5px) scale(1, 1); } }
  </style>
</svg>
