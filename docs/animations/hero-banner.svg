<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="1200" height="380" role="img" aria-label="Merchant Saathi - Team FinnovateX - Paytm AI Hackathon Pune">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071a35"/><stop offset="0.5" stop-color="#0b2447"/><stop offset="1" stop-color="#071a35"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/><stop offset="0.35" stop-color="#7dd3fc"/><stop offset="0.5" stop-color="#ffd76e"/><stop offset="0.65" stop-color="#00b9f1"/><stop offset="1" stop-color="#ffffff"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="-1.2 0; 1.2 0; -1.2 0" dur="4.5s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="ribbonA" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#00b9f1"/><stop offset="1" stop-color="#005f8f"/>
    </linearGradient>
    <linearGradient id="ribbonB" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e63946"/><stop offset="1" stop-color="#9d1c2e"/>
    </linearGradient>
    <linearGradient id="ribbonC" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#123a6e"/><stop offset="1" stop-color="#0b2447"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="380" fill="url(#bg)"/>

  <!-- diagonal ribbons (event-banner language), breathing slowly -->
  <g opacity="0.85">
    <path d="M -60 90 L 210 -60 L 300 -60 L 30 90 Z" fill="url(#ribbonA)" opacity="0.9">
      <animateTransform attributeName="transform" type="translate" values="0 0; 26 14; 0 0" dur="7s" repeatCount="indefinite"/>
    </path>
    <path d="M -40 130 L 170 8 L 210 8 L 0 130 Z" fill="url(#ribbonB)" opacity="0.75">
      <animateTransform attributeName="transform" type="translate" values="0 0; -18 10; 0 0" dur="9s" repeatCount="indefinite"/>
    </path>
    <path d="M 960 380 L 1240 190 L 1260 240 L 1030 380 Z" fill="url(#ribbonB)" opacity="0.7">
      <animateTransform attributeName="transform" type="translate" values="0 0; -20 -12; 0 0" dur="8s" repeatCount="indefinite"/>
    </path>
    <path d="M 1020 380 L 1260 260 L 1260 300 L 1075 380 Z" fill="url(#ribbonA)" opacity="0.85">
      <animateTransform attributeName="transform" type="translate" values="0 0; 16 -10; 0 0" dur="6s" repeatCount="indefinite"/>
    </path>
    <path d="M 1050 0 L 1200 0 L 1200 60 L 1090 60 Z" fill="url(#ribbonC)" opacity="0.9">
      <animateTransform attributeName="transform" type="translate" values="0 0; -12 8; 0 0" dur="10s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- starfield -->
  <g fill="#7dd3fc">
    <circle cx="120" cy="210" r="1.6" opacity="0.5"><animate attributeName="opacity" values="0.15;0.9;0.15" dur="2.4s" repeatCount="indefinite"/></circle>
    <circle cx="270" cy="60" r="1.3" opacity="0.4"><animate attributeName="opacity" values="0.8;0.15;0.8" dur="3.1s" repeatCount="indefinite"/></circle>
    <circle cx="905" cy="55" r="1.6" opacity="0.5"><animate attributeName="opacity" values="0.2;1;0.2" dur="2.8s" repeatCount="indefinite"/></circle>
    <circle cx="1010" cy="150" r="1.2" opacity="0.4"><animate attributeName="opacity" values="0.9;0.2;0.9" dur="3.6s" repeatCount="indefinite"/></circle>
    <circle cx="420" cy="330" r="1.3" opacity="0.35"><animate attributeName="opacity" values="0.2;0.8;0.2" dur="3s" repeatCount="indefinite"/></circle>
    <circle cx="760" cy="335" r="1.4" opacity="0.4"><animate attributeName="opacity" values="0.7;0.2;0.7" dur="2.6s" repeatCount="indefinite"/></circle>
  </g>

  <!-- rising rupee + cupcake particles -->
  <g opacity="0.20" font-size="26" font-weight="800">
    <text x="95" y="360" fill="#7dd3fc">&#8377;<animateTransform attributeName="transform" type="translate" values="0 0; 0 -320; 0 0" dur="11s" repeatCount="indefinite"/></text>
    <text x="1128" y="370" fill="#ffd76e">&#129471;<animateTransform attributeName="transform" type="translate" values="0 0; 0 -300; 0 0" dur="13s" begin="2s" repeatCount="indefinite"/></text>
    <text x="330" y="375" fill="#ffd76e">&#8377;<animateTransform attributeName="transform" type="translate" values="0 0; 0 -330; 0 0" dur="15s" begin="5s" repeatCount="indefinite"/></text>
    <text x="875" y="368" fill="#7dd3fc">&#9749;<animateTransform attributeName="transform" type="translate" values="0 0; 0 -310; 0 0" dur="12s" begin="7s" repeatCount="indefinite"/></text>
  </g>

  <!-- top sweep line -->
  <rect x="0" y="0" width="1200" height="4" fill="#00b9f1">
    <animate attributeName="width" values="0;1200;1200" keyTimes="0;0.5;1" dur="2.4s" fill="freeze"/>
  </rect>

  <!-- kicker -->
  <text x="600" y="66" text-anchor="middle" font-family="Segoe UI, Arial" font-size="15" font-weight="700" letter-spacing="6" fill="#7dd3fc">
    MEET YOUR AI BUSINESS BUDDY
    <animate attributeName="opacity" values="0;1" dur="1.4s" fill="freeze"/>
  </text>

  <!-- title with shine -->
  <text x="600" y="148" text-anchor="middle" font-family="Segoe UI, Arial" font-size="64" font-weight="800" fill="#ffffff">
    Merchant <tspan fill="url(#shine)">Saathi</tspan>
    <animate attributeName="opacity" values="0;1" dur="1.8s" fill="freeze"/>
  </text>
  <text x="600" y="186" text-anchor="middle" font-family="Segoe UI, Arial" font-size="17" fill="#c9dcef">
    The evidence-backed copilot for every Paytm merchant
    <animate attributeName="opacity" values="0;1" dur="2.3s" fill="freeze"/>
  </text>

  <!-- pillar chips, staggered pop-in then gentle pulse -->
  <g font-family="Segoe UI, Arial" font-size="14.5" font-weight="700" text-anchor="middle">
    <g opacity="0">
      <rect x="205" y="212" width="170" height="42" rx="21" fill="#0e2c55" stroke="#00b9f1" stroke-width="1.3"/>
      <text x="290" y="239" fill="#7dd3fc">Grow</text>
      <animate attributeName="opacity" values="0;1" dur="0.5s" begin="2.2s" fill="freeze"/>
    </g>
    <g opacity="0">
      <rect x="395" y="212" width="170" height="42" rx="21" fill="#0e2c55" stroke="#00b9f1" stroke-width="1.3"/>
      <text x="480" y="239" fill="#7dd3fc">Manage</text>
      <animate attributeName="opacity" values="0;1" dur="0.5s" begin="2.45s" fill="freeze"/>
    </g>
    <g opacity="0">
      <rect x="585" y="212" width="170" height="42" rx="21" fill="#0e2c55" stroke="#00b9f1" stroke-width="1.3"/>
      <text x="670" y="239" fill="#7dd3fc">Serve</text>
      <animate attributeName="opacity" values="0;1" dur="0.5s" begin="2.7s" fill="freeze"/>
    </g>
    <g opacity="0">
      <rect x="775" y="212" width="220" height="42" rx="21" fill="#123a2a" stroke="#4ade80" stroke-width="1.3"/>
      <text x="885" y="239" fill="#4ade80">Plan my next sale</text>
      <animate attributeName="opacity" values="0;1" dur="0.5s" begin="2.95s" fill="freeze"/>
    </g>
  </g>
  <g opacity="0">
    <animate attributeName="opacity" values="0;0.95;0.95" keyTimes="0;0.06;1" dur="3.4s" fill="freeze"/>
    <text x="600" y="286" text-anchor="middle" font-family="Segoe UI, Arial" font-size="12.5" fill="#8fb3d9">117 tests &#183; evidence receipts on every number &#183; nothing fake, nothing sent</text>
  </g>

  <!-- Pune skyline line-art (event-banner nod), drawn itself then a scan light passes -->
  <g stroke="#3f6ea6" stroke-width="1.6" fill="none" opacity="0.9">
    <path d="M 140 352 L 140 330 L 158 330 L 158 352 M 158 336 L 176 336 L 176 352 M 200 352 L 200 318 L 206 310 L 212 318 L 212 352 M 240 352 L 240 326 L 262 326 L 262 332 L 268 332 L 268 352 M 300 352 L 300 308 L 306 300 L 312 308 L 312 352 M 340 352 L 340 334 L 356 326 L 372 334 L 372 352">
      <animate attributeName="stroke-dasharray" values="0 600; 600 0" dur="3s" begin="1s" fill="freeze"/>
    </path>
    <path d="M 430 352 L 430 322 L 444 312 L 458 322 L 458 352 M 470 352 L 470 330 L 492 330 L 492 352 M 520 352 L 520 304 L 527 296 L 534 304 L 534 352 M 560 352 L 560 332 L 580 322 L 600 332 L 600 352 M 628 352 L 628 312 L 640 302 L 652 312 L 652 352">
      <animate attributeName="stroke-dasharray" values="0 600; 600 0" dur="3s" begin="1.4s" fill="freeze"/>
    </path>
    <path d="M 690 352 L 690 330 L 706 330 L 706 352 M 730 352 L 730 300 L 736 292 L 742 300 L 742 352 M 768 352 L 768 326 L 790 326 L 790 333 L 796 333 L 796 352 M 826 352 L 826 310 L 834 300 L 842 310 L 842 352 M 868 352 L 868 334 L 884 326 L 900 334 L 900 352">
      <animate attributeName="stroke-dasharray" values="0 600; 600 0" dur="3s" begin="1.8s" fill="freeze"/>
    </path>
    <path d="M 930 352 L 930 318 L 944 308 L 958 318 L 958 352 M 975 352 L 975 330 L 995 330 L 995 352 M 1015 352 L 1015 306 L 1022 298 L 1029 306 L 1029 352 M 1055 352 L 1055 332 L 1072 324 L 1089 332 L 1089 352 M 1110 352 L 1110 328 L 1130 328 L 1130 352">
      <animate attributeName="stroke-dasharray" values="0 600; 600 0" dur="3s" begin="2.2s" fill="freeze"/>
    </path>
    <line x1="120" y1="352" x2="1120" y2="352"/>
  </g>
  <rect x="0" y="344" width="26" height="10" fill="#00b9f1" opacity="0.55">
    <animate attributeName="x" values="60;1140;60" dur="9s" repeatCount="indefinite"/>
  </rect>

  <!-- team line -->
  <text x="600" y="318" text-anchor="middle" font-family="Segoe UI, Arial" font-size="17" font-weight="800" fill="#ffd76e">
    Team FinnovateX &#10022;
    <animate attributeName="opacity" values="0.5;1;0.5" dur="2.8s" repeatCount="indefinite"/>
  </text>
  <text x="600" y="338" text-anchor="middle" font-family="Segoe UI, Arial" font-size="11.5" fill="#8fb3d9">
    Arya Jannawar &#183; Siddhant Pardeshi &#183; Avani Jannawar &#8212; Paytm AI Hackathon &#183; Pune &#183; Track 1
    <animate attributeName="opacity" values="0;1" dur="2.8s" fill="freeze"/>
  </text>
</svg>
